<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>BLACK FORTIS</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#000;width:100%;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
#intro{position:fixed;inset:0;z-index:10;background:#000;display:flex;align-items:center;justify-content:center}
#intro video{width:100%;height:100%;object-fit:cover;background:#000}
#landing{display:none;width:100%;max-width:900px;margin:0 auto;position:relative;background:#000}
#landing img{display:block;width:100%;height:auto}
/* 투명 링크: 랜딩 이미지 맨 아래 'BLACK FORTIS 친구 되러 가기' 영역 */
#friendLink{
 position:absolute;left:7%;right:7%;bottom:2.0%;height:7.2%;
 z-index:3;border-radius:18px;text-indent:-9999px;overflow:hidden;
}
#skipFallback{display:none}
</style>
</head>
<body>
<div id="intro">
  <video id="roar" autoplay muted playsinline preload="auto">
    <source src="black-fortis-emblem-roar.mp4" type="video/mp4">
  </video>
</div>

<main id="landing">
  <img src="black-fortis-original.png" alt="BLACK FORTIS 랜딩페이지">
  <a id="friendLink" href="https://open.kakao.com/o/sZQahZIi" target="_blank" rel="noopener noreferrer"
     aria-label="BLACK FORTIS 친구 되러 가기 - 카카오 오픈채팅"></a>
</main>

<script>
(function(){
  const intro = document.getElementById('intro');
  const video = document.getElementById('roar');
  const landing = document.getElementById('landing');
  let finished = false;

  function showLanding(){
    if (finished) return;
    finished = true;
    video.pause();
    intro.style.display = 'none';
    landing.style.display = 'block';
    window.scrollTo(0,0);
  }

  // 랜딩페이지 전환은 영상이 실제로 끝났을 때만 실행
  video.addEventListener('ended', showLanding);

  // iPhone/Safari 자동재생 조건
  video.muted = true;
  video.defaultMuted = true;
  video.playsInline = true;
  video.autoplay = true;

  function startRoar(){
    if (finished) return;
    const p = video.play();
    if (p && p.catch) {
      p.catch(function(){
        // 실패해도 랜딩페이지로 넘기지 않는다.
        // 브라우저가 다시 재생을 허용할 때 재시도한다.
      });
    }
  }

  // 페이지가 열리자마자 재생 시도
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startRoar, {once:true});
  } else {
    startRoar();
  }

  // Safari에서 로딩 타이밍 때문에 첫 시도가 실패하는 경우 재시도
  video.addEventListener('canplay', startRoar);
  video.addEventListener('loadeddata', startRoar);
  window.addEventListener('pageshow', startRoar);

  // 화면이 다시 활성화됐을 때도 포효 영상이 아직 끝나지 않았다면 재생
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && !finished && !video.ended) startRoar();
  });
})();
</script>
</body>
</html>
