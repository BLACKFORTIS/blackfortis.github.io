<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>BLACK FORTIS</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif}body{overflow-x:hidden}
.intro{position:fixed;inset:0;z-index:10;background:#050505;display:grid;place-items:center;opacity:1;visibility:visible;transition:opacity .8s ease,visibility .8s ease}
.intro.done{opacity:0;visibility:hidden;pointer-events:none}.intro video{width:100%;height:100%;object-fit:contain;background:#050505}
.landing{width:min(1024px,100%);margin:0 auto;opacity:0;transition:opacity .8s ease}.landing.show{opacity:1}.poster-wrap{position:relative;width:100%}.poster{display:block;width:100%;height:auto}
.friend-link{position:absolute;z-index:2;left:45%;top:84.6%;width:49%;height:9.4%;border-radius:12px;text-indent:-9999px;overflow:hidden;-webkit-tap-highlight-color:transparent}
.friend-link:focus-visible{outline:3px solid #fff;outline-offset:-4px}
@media(max-width:520px){.friend-link{left:44.5%;top:84.3%;width:50%;height:10%}}
@media(prefers-reduced-motion:reduce){.intro,.landing{transition:none}}
</style>
</head>
<body>
<section class="intro" id="intro" aria-label="BLACK FORTIS 포효 인트로">
 <video id="introVideo" autoplay muted playsinline preload="auto" poster="black-fortis-original.png">
  <source src="black-fortis-emblem-roar.mp4" type="video/mp4">
 </video>
</section>
<main class="landing" id="landing">
 <div class="poster-wrap">
  <img class="poster" src="black-fortis-original.png" alt="BLACK FORTIS 스스로 하는 아이들의 아지트 안내">
  <a class="friend-link" href="https://open.kakao.com/o/sZQahZIi" target="_blank" rel="noopener noreferrer" aria-label="BLACK FORTIS 친구 되러 가기 - 카카오 오픈채팅">BLACK FORTIS 친구 되러 가기</a>
 </div>
</main>
<script>
const intro=document.getElementById('intro');
const landing=document.getElementById('landing');
const video=document.getElementById('introVideo');
let finished=false;
function showLanding(){if(finished)return;finished=true;landing.classList.add('show');intro.classList.add('done');video.pause();window.scrollTo(0,0)}
video.addEventListener('ended',showLanding,{once:true});
video.addEventListener('error',showLanding,{once:true});
// 모바일 브라우저에서 자동재생이 실패해도 랜딩페이지에 갇히지 않도록 처리
const p=video.play();if(p&&p.catch)p.catch(()=>showLanding());
// 비정상적으로 ended 이벤트가 오지 않는 경우를 위한 안전장치
setTimeout(showLanding,12000);
</script>
</body></html>
